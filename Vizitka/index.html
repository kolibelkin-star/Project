<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юрий Колыбелкин — Основатель OrderFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 24px;
            padding: 60px;
            max-width: 1200px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .logo-order {
            color: #ffffff;
        }

        .logo-flow {
            color: #C6FF00;
        }

        .divider {
            width: 440px;
            height: 2px;
            background: #C6FF00;
            margin-bottom: 100px;
        }

        .content-wrapper {
            position: relative;
        }

        .content {
            max-width: 580px;
            position: relative;
            z-index: 2;
        }

        .name {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 32px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .title {
            font-size: 24px;
            color: #999;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .description {
            font-size: 20px;
            color: #666;
            margin-bottom: 60px;
            font-weight: 400;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 300px;
        }

        .btn-primary {
            background: #C6FF00;
            color: #000;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(198, 255, 0, 0.4);
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .social-link:hover {
            transform: translateY(-3px) scale(1.1);
            background: rgba(198, 255, 0, 0.1);
            box-shadow: 0 8px 16px rgba(198, 255, 0, 0.3);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            fill: #fff;
            transition: fill 0.2s ease;
        }

        .social-link:hover svg {
            fill: #C6FF00;
        }

        /* Technical Grid */
        .grid-overlay {
            position: absolute;
            left: 54%;
            right: 0;
            top: 0;
            bottom: 0;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.45;
        }

        .grid-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .grid-lines {
            position: absolute;
            inset: 0;
        }

        .grid-line {
            position: absolute;
            background: #333;
        }

        .grid-line.vertical {
            width: 1px;
            height: 100%;
            top: 0;
        }

        .grid-line.horizontal {
            height: 1px;
            width: 100%;
            left: 0;
        }

        .grid-line.accent {
            background: #C8FF00;
            width: 2px;
            opacity: 1;
        }

        .grid-node {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #C8FF00;
            transform: translate(-50%, -50%);
            animation: nodePulse 4s ease-in-out infinite;
        }

        @keyframes nodePulse {
            0%, 100% {
                opacity: 0.35;
                transform: translate(-50%, -50%) scale(0.85);
                box-shadow: 0 0 0 rgba(200, 255, 0, 0);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
                box-shadow: 0 0 14px rgba(200, 255, 0, 0.7);
            }
        }

        .grid-node:nth-child(1) {
            animation-delay: 0s;
        }

        .grid-node:nth-child(2) {
            animation-delay: 0.6s;
        }

        .grid-node:nth-child(3) {
            animation-delay: 1.2s;
        }

        .grid-node:nth-child(4) {
            animation-delay: 1.8s;
        }

        .grid-node:nth-child(5) {
            animation-delay: 2.4s;
        }

        .grid-node:nth-child(6) {
            animation-delay: 3s;
        }

        .grid-shape {
            position: absolute;
            border: 1px solid #333;
            border-radius: 20px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .modal-btn:hover {
            background: rgba(198, 255, 0, 0.1);
            border-color: #C6FF00;
            transform: translateY(-1px);
        }

        .modal-btn.close {
            background: transparent;
            color: #666;
            border: none;
            margin-top: 12px;
        }

        .modal-btn.close:hover {
            color: #fff;
            background: transparent;
            transform: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .grid-overlay {
                width: 100%;
                opacity: 0.3;
            }

            .name {
                font-size: 48px;
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 40px 30px;
            }

            .logo {
                font-size: 28px;
            }

            .divider {
                width: 100%;
                max-width: 300px;
                margin-bottom: 60px;
            }

            .name {
                font-size: 36px;
            }

            .title {
                font-size: 20px;
            }

            .description {
                font-size: 16px;
                margin-bottom: 40px;
            }

            .actions {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 class="modal-title">Выберите удобный способ связи</h2>
            <div class="modal-actions">
                <a href="https://t.me/YuriyKneo" class="modal-btn" target="_blank" rel="noopener noreferrer">Telegram</a>
                <a href="mailto:kolibelkiny@gmail.com" class="modal-btn">Email</a>
                <button class="modal-btn close" id="modalClose">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // Modal functionality
        const contactBtn = document.getElementById('contactBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');

        function openModal() {
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        contactBtn.addEventListener('click', openModal);
        modalClose.addEventListener('click', closeModal);

        // Close modal on overlay click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
